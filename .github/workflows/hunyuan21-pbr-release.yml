name: Validate Hunyuan3D 2.1 PBR updater

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: Run full build only after adding the complete hashed Windows dependency lock
        required: true
        default: false
        type: boolean
      license_accepted:
        description: I accept the Tencent Hunyuan 3D 2.1 Community License for this build
        required: true
        default: false
        type: boolean
      territory_confirmed:
        description: The self-hosted runner and operator are outside the EU, UK, and South Korea
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mujassam-hunyuan3d-21-pbr-v1
  cancel-in-progress: false

jobs:
  adapter-static-validation:
    name: Adapter-only model-free validation
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Mujassam AI adapter source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select CPython 3.11.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Compile repository-owned Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            app/worker.py `
            app/engines/hunyuan21/hunyuan21_worker.py `
            build/patch_hunyuan21_windows.py `
            build/validate_hunyuan21_adapter.py
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }

      - name: Validate repository-owned adapter without Tencent source or weights
        shell: pwsh
        run: |
          python build/validate_hunyuan21_adapter.py
          if ($LASTEXITCODE -ne 0) { throw "Adapter static validation failed" }

      - name: Run base worker self-test
        shell: pwsh
        run: |
          python app/worker.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Base worker self-test failed" }

      - name: Run Paint low-VRAM model-free self-test
        shell: pwsh
        run: |
          $LowVramSelfTest = @'
          import importlib.util
          import sys
          from pathlib import Path

          worker_path = Path("app/engines/hunyuan21/hunyuan21_worker.py").resolve()
          spec = importlib.util.spec_from_file_location(
              "mujassam_h21_lowvram_ci", worker_path
          )
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not import the Hunyuan 2.1 worker")
          worker = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = worker
          spec.loader.exec_module(worker)
          if not worker._paint_low_vram_runtime_self_test():
              raise RuntimeError("Paint low-VRAM model-free self-test failed")
          print("MJHUNYUAN21LOWVRAMSELFTEST|OK|1")
          '@
          $LowVramSelfTest | python -S -
          if ($LASTEXITCODE -ne 0) { throw "Paint low-VRAM self-test failed" }

      - name: Parse established PowerShell sources
        shell: pwsh
        run: |
          foreach ($ScriptPath in @(
            "build/build-hunyuan21-update.ps1",
            "build/hotfix-hunyuan21-rasterizer.ps1",
            "build/hotfix-hunyuan21-paint-8gb.ps1",
            "build/build-hunyuan21-local.ps1",
            "build/resume-hunyuan21-local.ps1",
            "installer/install-hunyuan21-local.ps1",
            "installer/restore-hunyuan21-local.ps1"
          )) {
            $Tokens = $null
            $Errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $ScriptPath), [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -ne 0) {
              $Messages = @($Errors | ForEach-Object { $_.Message }) -join "; "
              throw "PowerShell syntax failed for ${ScriptPath}: $Messages"
            }
          }

      - name: Parse Mini-only removal script
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/remove-hunyuan21-local.ps1"),
            [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -ne 0) {
            $Messages = @($Errors | ForEach-Object {
              "line $($_.Extent.StartLineNumber): $($_.Message)"
            }) -join "; "
            throw "PowerShell syntax failed for Mini-only remover: $Messages"
          }

      - name: Verify GUI Mini self-test wait guard
        shell: pwsh
        run: |
          $RemoverSource = Get-Content `
            "installer/remove-hunyuan21-local.ps1" -Raw
          $GuiWaitPattern = `
            '(?s)\$GuiSelfTestProcess\s*=\s*Start-Process.*?-Wait\s+-PassThru\s+-ErrorAction\s+Stop.*?\$GuiSelfTestExitCode\s*=\s*\$GuiSelfTestProcess\.ExitCode'
          if ($RemoverSource -cnotmatch $GuiWaitPattern -or
              -not $RemoverSource.Contains('$GuiSelfTestProcess.Dispose()')) {
            throw "GUI Mini self-test must wait for winexe and consume ExitCode"
          }
          Write-Host "MJHUNYUAN21GUIWAITSELFTEST|OK|1"

      - name: Exercise transactional H21 deep cleanup and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TestRoot = Join-Path $env:RUNNER_TEMP (
            "mujassam-h21-remove-" + [Guid]::NewGuid().ToString("N"))
          # Both the current InstallRoot and its parent deliberately resemble
          # setup leftovers.  Neither may ever become a cleanup target.
          $SetupAncestor = Join-Path $TestRoot "MAI-13579bdf"
          $Install = Join-Path $SetupAncestor "MHU-2468ace0"
          $Local = Join-Path $TestRoot "local"
          $Profile = Join-Path $TestRoot "profile"
          $Temp = Join-Path $TestRoot "temp"
          foreach ($Directory in @(
            $SetupAncestor, $Install, $Local, $Profile, $Temp
          )) {
            [IO.Directory]::CreateDirectory($Directory) | Out-Null
          }

          function Write-TestText([string]$Path, [string]$Text) {
            $Parent = [IO.Path]::GetDirectoryName($Path)
            [IO.Directory]::CreateDirectory($Parent) | Out-Null
            [IO.File]::WriteAllText(
              $Path, $Text, [Text.UTF8Encoding]::new($false))
          }
          function Get-TestSha256([string]$Path) {
            (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $PortableRuntime = Join-Path $Install "rt"
          [IO.Directory]::CreateDirectory($PortableRuntime) | Out-Null
          $StubSource = Join-Path $TestRoot "python-stub.cs"
          Write-TestText $StubSource @'
          using System;
          using System.IO;
          internal static class Program
          {
              private static int Main(string[] args)
              {
                  if (Array.IndexOf(args, "--self-test") < 0) return 7;
                  string script = null;
                  foreach (string value in args)
                  {
                      if (value.EndsWith(".py", StringComparison.OrdinalIgnoreCase) &&
                          File.Exists(value)) script = value;
                  }
                  if (script == null) return 8;
                  string source = File.ReadAllText(script);
                  if (!source.Contains("MJSELFTEST|OK|3") &&
                      !source.Contains("MJHUNYUANSELFTEST|OK|1")) return 9;
                  Console.WriteLine("MJSELFTEST|OK|3");
                  return 0;
              }
          }
          '@
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsInstall = & $VsWhere -latest -products * -requires Microsoft.Component.MSBuild `
              -property installationPath | Select-Object -First 1
          if (-not $VsInstall) { throw "Visual Studio compiler was not found" }
          $Csc = Join-Path $VsInstall "MSBuild\Current\Bin\Roslyn\csc.exe"
          $PortablePython = Join-Path $PortableRuntime "python.exe"
          & $Csc /nologo /target:exe "/out:$PortablePython" $StubSource
          if ($LASTEXITCODE -ne 0) { throw "Could not compile the portable test stub" }

          $OriginalExe = Join-Path $TestRoot "original-MujassamAI.exe"
          $GuiStubSource = Join-Path $TestRoot "gui-stub.cs"
          Write-TestText $GuiStubSource @'
          using System;
          using System.IO;
          using System.Text;
          internal static class Program
          {
              private static int Main(string[] args)
              {
                  if (args.Length < 2 || args[0] != "--self-test") return 7;
                  File.WriteAllText(args[1],
                      "PortableLayout=OK\nJobSchema=OK\nIs64BitProcess=True\n",
                      new UTF8Encoding(false));
                  return 0;
              }
          }
          '@
          & $Csc /nologo /target:winexe "/out:$OriginalExe" $GuiStubSource
          if ($LASTEXITCODE -ne 0) { throw "Could not compile the GUI test stub" }
          $InstalledExe = Join-Path $Install "MujassamAI.exe"
          [IO.File]::WriteAllBytes(
            $InstalledExe, [Text.Encoding]::ASCII.GetBytes("MZ-pbr-installed"))
          $OriginalWorker = Join-Path $TestRoot "original-worker.py"
          $InstalledWorker = Join-Path $Install "app\worker.py"
          Write-TestText $OriginalWorker 'print("MJSELFTEST|OK|3")'
          Write-TestText $InstalledWorker 'ENGINE = "hunyuan3d_2_1_pbr"'
          $Hunyuan2Worker = Join-Path $Install `
            "app\engines\hunyuan2\hunyuan2_worker.py"
          $Hunyuan2Manifest = Join-Path $Install `
            "app\engines\hunyuan2\ENGINE-MANIFEST.json"
          Write-TestText $Hunyuan2Worker 'print("MJHUNYUANSELFTEST|OK|1")'
          Write-TestText $Hunyuan2Manifest '{"engine":"mini"}'
          $Hunyuan2WorkerHash = Get-TestSha256 $Hunyuan2Worker
          $Hunyuan2ManifestHash = Get-TestSha256 $Hunyuan2Manifest
          Write-TestText (Join-Path $Install "models\mini.keep") "keep-models"
          Write-TestText (Join-Path $Install "app\vendor\mini.keep") "keep-vendor"
          Write-TestText (Join-Path $Install "app\user.keep") "keep-user"

          $InstalledH21Worker = Join-Path $Install `
            "app\engines\hunyuan21\hunyuan21_worker.py"
          $InstalledH21Payload = "pbr-worker-before-hotfix"
          Write-TestText $InstalledH21Worker $InstalledH21Payload
          $ReceiptH21WorkerHash = Get-TestSha256 $InstalledH21Worker
          # A later hotfix hash is intentionally permitted only in this tree.
          Write-TestText $InstalledH21Worker "pbr-worker-after-hotfix"
          Write-TestText (Join-Path $Install `
            "app\engines\hunyuan21\unreceipted-hotfix.keep") "remove-tree"
          $OutsideCreated = Join-Path $Install "app\quality\ultimate-only.keep"
          Write-TestText $OutsideCreated "receipt-owned"

          $BackupParent = Join-Path $Local "MujassamAI\Backups"
          $Baseline = Join-Path $BackupParent `
            "hunyuan21-20000101T000000Z-1234abcd"
          [IO.Directory]::CreateDirectory($Baseline) | Out-Null
          [IO.Directory]::CreateDirectory(
            (Join-Path $Baseline "app")) | Out-Null
          [IO.File]::Copy(
            $OriginalExe, (Join-Path $Baseline "MujassamAI.exe"), $false)
          [IO.File]::Copy(
            $OriginalWorker, (Join-Path $Baseline "app\worker.py"), $false)
          $OriginalExeBackup = Join-Path $Baseline "MujassamAI.exe"
          $OriginalWorkerBackup = Join-Path $Baseline "app\worker.py"
          $OriginalExeHash = Get-TestSha256 $OriginalExeBackup
          $OriginalWorkerHash = Get-TestSha256 $OriginalWorkerBackup
          $Receipt = [ordered]@{
            schema_version = 1
            created_utc = "2000-01-01T00:00:00.0000000+00:00"
            install_root = $Install
            update_zip = (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip")
            update_zip_sha256 = ("0" * 64)
            overwritten_files = @(
              [ordered]@{
                path = "MujassamAI.exe"
                bytes = [IO.File]::ReadAllBytes($OriginalExeBackup).Length
                sha256 = (Get-TestSha256 $OriginalExeBackup)
                installed_sha256 = (Get-TestSha256 $InstalledExe)
              },
              [ordered]@{
                path = "app/worker.py"
                bytes = (Get-Item -LiteralPath $OriginalWorkerBackup).Length
                sha256 = (Get-TestSha256 $OriginalWorkerBackup)
                installed_sha256 = (Get-TestSha256 $InstalledWorker)
              }
            )
            created_files = @(
              [ordered]@{
                path = "app/engines/hunyuan21/hunyuan21_worker.py"
                installed_sha256 = $ReceiptH21WorkerHash
              },
              [ordered]@{
                path = "app/quality/ultimate-only.keep"
                installed_sha256 = (Get-TestSha256 $OutsideCreated)
              }
            )
          }
          Write-TestText (Join-Path $Baseline "install-receipt.json") `
            ($Receipt | ConvertTo-Json -Depth 8)

          # A newer, otherwise valid receipt has a marker-free worker but its
          # saved PE is PBR-tainted.  It must be rejected in favor of the older
          # real Mini baseline rather than restored or accepted by a marker.
          $RejectedPbrExeBackup = Join-Path $BackupParent `
            "hunyuan21-20000105T000000Z-badc0ffe"
          [IO.Directory]::CreateDirectory($RejectedPbrExeBackup) | Out-Null
          $RejectedPbrExe = Join-Path $RejectedPbrExeBackup "MujassamAI.exe"
          [IO.File]::WriteAllBytes($RejectedPbrExe,
            [Text.Encoding]::ASCII.GetBytes(
              "MZ-hunyuan3d_2_1_pbr-newer-false-baseline"))
          $RejectedPbrWorker = Join-Path $RejectedPbrExeBackup "app\worker.py"
          Write-TestText $RejectedPbrWorker 'print("MJSELFTEST|OK|3")'
          $RejectedPbrReceipt = [ordered]@{
            schema_version = 1
            created_utc = "2000-01-05T00:00:00.0000000+00:00"
            install_root = $Install
            update_zip = (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip")
            update_zip_sha256 = ("5" * 64)
            overwritten_files = @(
              [ordered]@{
                path = "MujassamAI.exe"
                bytes = (Get-Item -LiteralPath $RejectedPbrExe).Length
                sha256 = (Get-TestSha256 $RejectedPbrExe)
                installed_sha256 = (Get-TestSha256 $InstalledExe)
              },
              [ordered]@{
                path = "app/worker.py"
                bytes = (Get-Item -LiteralPath $RejectedPbrWorker).Length
                sha256 = (Get-TestSha256 $RejectedPbrWorker)
                installed_sha256 = (Get-TestSha256 $InstalledWorker)
              }
            )
            created_files = @(
              [ordered]@{
                path = "app/engines/hunyuan21/hunyuan21_worker.py"
                installed_sha256 = $ReceiptH21WorkerHash
              },
              [ordered]@{
                path = "app/quality/ultimate-only.keep"
                installed_sha256 = (Get-TestSha256 $OutsideCreated)
              }
            )
          }
          Write-TestText (Join-Path $RejectedPbrExeBackup `
            "install-receipt.json") `
            ($RejectedPbrReceipt | ConvertTo-Json -Depth 8)

          # This other later original-looking directory has no receipt.
          $RejectedLaterBackup = Join-Path $BackupParent `
            "hunyuan21-20000102T000000Z-deadbeef"
          Write-TestText (Join-Path $RejectedLaterBackup "not-a-receipt.keep") "reject"
          $PaintBackup = Join-Path $BackupParent `
            "hunyuan21-paint-8gb-20000103T000000Z-feedface"
          $RasterizerBackup = Join-Path $BackupParent `
            "hunyuan21-rasterizer-20000104T000000Z-cafebabe"
          $UnrelatedBackup = Join-Path $BackupParent "hunyuan2-keep"
          Write-TestText (Join-Path $BackupParent `
            "hunyuan21-paint-8gb-20000103T000000Z-feedface\worker.keep") "remove"
          Write-TestText (Join-Path $RasterizerBackup "worker.keep") "remove"
          Write-TestText (Join-Path $UnrelatedBackup "mini.keep") "keep"
          Write-TestText (Join-Path $Local `
            "MujassamAI\Engines\Hunyuan3D-2.1\models\pbr.keep") "remove"
          Write-TestText (Join-Path $Local `
            "MujassamAI\Engines\Hunyuan3D-2\models\mini.keep") "keep"
          Write-TestText (Join-Path $Local `
            "MujassamAI\Licenses\acceptance-v2-1.txt") "remove"
          foreach ($AppCleanupName in @(
            "HunyuanUpdateCache", "UpdaterLogs", "InstallerCache", "InstallerLogs"
          )) {
            Write-TestText (Join-Path $Local `
              "MujassamAI\$AppCleanupName\h21.keep") "remove"
          }
          Write-TestText (Join-Path $Local `
            "MujassamAI\UnrelatedCache\mini.keep") "keep"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip") "remove"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip.sha256") "remove"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104834.zip") `
            "remove"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104834.zip.sha256") `
            "remove"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104835-deadbeef.zip") `
            "remove"
          Write-TestText (Join-Path $Profile `
            "Downloads\keep.zip") "keep"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Exports\model.glb") "keep"
          Write-TestText (Join-Path $Profile `
            "Documents\MujassamAI-Exports\model.glb") "keep"
          Write-TestText (Join-Path $Install "exports\model.glb") "keep"
          Write-TestText (Join-Path $Profile `
            "Downloads\MujassamAI-Build-UAE-test\repo.keep") "keep"
          foreach ($SetupName in @(
            "MAI-1234abcd", "MHU-89abcdef",
            "MujassamAI-HunyuanBackup-deadbeef"
          )) {
            Write-TestText (Join-Path $SetupAncestor `
              "$SetupName\h21.keep") "remove"
          }
          # Previous/Failed are intentionally outside the exact cleanup
          # contract, and a setup-looking tree with nested exports is user data.
          $PreviousSetup = Join-Path $SetupAncestor `
            "MujassamAI-Previous-123456abcdef"
          $FailedSetup = Join-Path $SetupAncestor `
            "MujassamAI-Failed-fedcba654321"
          $NestedExportSetup = Join-Path $SetupAncestor "MAI-feedface"
          Write-TestText (Join-Path $PreviousSetup "keep") "keep"
          Write-TestText (Join-Path $FailedSetup "keep") "keep"
          Write-TestText (Join-Path $NestedExportSetup `
            "nested\Exports\model.glb") "keep"
          Write-TestText (Join-Path $SetupAncestor "ancestor.keep") "keep"
          Write-TestText (Join-Path $SetupAncestor "other-install\keep") "keep"
          Write-TestText (Join-Path $Temp `
            ("MujassamAI-hy21-" + ("a" * 32) + "\temp.keep")) "remove"
          Write-TestText (Join-Path $Temp `
            ("MujassamAI-hy21-install-" + ("b" * 32) + "\temp.keep")) "remove"
          Write-TestText (Join-Path $Temp `
            ("MujassamAI-hy21-rasterizer-" + ("c" * 32) + "\temp.keep")) "remove"
          Write-TestText (Join-Path $Temp "other-temp\keep") "keep"
          Write-TestText (Join-Path $Profile `
            ("Documents\.MujassamAI-hy21-staging-" + ("d" * 32) +
              "\stage.keep")) "remove"
          Write-TestText (Join-Path $Profile "Documents\user-folder\keep") "keep"

          # Simulate closing PowerShell after app/worker.py was atomically
          # renamed but before the journal advanced from planned -> moved.
          # Startup recovery must restore this required file before preflight.
          $RestoreCrashId = "1" * 32
          $RestoreCrashQuarantine = Join-Path $Install `
            ".MujassamAI-hy21-quarantine-$RestoreCrashId"
          [IO.Directory]::CreateDirectory($RestoreCrashQuarantine) | Out-Null
          $RestoreCrashItem = Join-Path $RestoreCrashQuarantine "item-000000"
          $RestoreCrashOriginalHash = Get-TestSha256 $InstalledWorker
          [IO.File]::Move($InstalledWorker, $RestoreCrashItem, $false)
          $RestoreCrashJournal = [ordered]@{
            schema_version = 2
            transaction_id = $RestoreCrashId
            purpose = "restore"
            state = "active"
            install_root = $Install
            entries = @(
              [ordered]@{
                item_name = "item-000000"
                quarantine_item = "item-000000"
                original_path = $InstalledWorker
                containment_root = $Install
                kind = "file"
                original_sha256 = $RestoreCrashOriginalHash
                replacement_sha256 = $OriginalWorkerHash
                state = "planned"
              }
            )
          }
          Write-TestText (Join-Path $RestoreCrashQuarantine `
            "transaction.json") ($RestoreCrashJournal | ConvertTo-Json -Depth 8)
          if (Test-Path -LiteralPath $InstalledWorker) {
            throw "Active-restore fixture failed to hide the required worker"
          }

          $RemoveArguments = @{
            InstallRoot = $Install
            LocalApplicationDataRoot = $Local
            UserProfileRoot = $Profile
            TemporaryRoot = $Temp
            DeepCleanup = $true
            Confirm = $false
          }
          & ./installer/remove-hunyuan21-local.ps1 @RemoveArguments
          if ($LASTEXITCODE -ne 0) { throw "First Mini-only removal failed" }

          if ((Get-TestSha256 $InstalledExe) -cne $OriginalExeHash -or
              (Get-TestSha256 $InstalledWorker) -cne $OriginalWorkerHash -or
              (Get-TestSha256 $Hunyuan2Worker) -cne $Hunyuan2WorkerHash -or
              (Get-TestSha256 $Hunyuan2Manifest) -cne $Hunyuan2ManifestHash) {
            throw "Mini files were not restored/preserved exactly"
          }
          foreach ($Removed in @(
            (Join-Path $Install "app\engines\hunyuan21"),
            $OutsideCreated,
            $Baseline,
            $RejectedPbrExeBackup,
            $RejectedLaterBackup,
            $PaintBackup,
            $RasterizerBackup,
            $RestoreCrashQuarantine,
            (Join-Path $Local "MujassamAI\Engines\Hunyuan3D-2.1"),
            (Join-Path $Local "MujassamAI\Licenses\acceptance-v2-1.txt"),
            (Join-Path $Local "MujassamAI\HunyuanUpdateCache"),
            (Join-Path $Local "MujassamAI\UpdaterLogs"),
            (Join-Path $Local "MujassamAI\InstallerCache"),
            (Join-Path $Local "MujassamAI\InstallerLogs"),
            (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip"),
            (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip.sha256"),
            (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104834.zip"),
            (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104834.zip.sha256"),
            (Join-Path $Profile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1-20260827-104835-deadbeef.zip"),
            (Join-Path $SetupAncestor "MAI-1234abcd"),
            (Join-Path $SetupAncestor "MHU-89abcdef"),
            (Join-Path $SetupAncestor "MujassamAI-HunyuanBackup-deadbeef"),
            (Join-Path $Temp ("MujassamAI-hy21-" + ("a" * 32))),
            (Join-Path $Temp ("MujassamAI-hy21-install-" + ("b" * 32))),
            (Join-Path $Temp ("MujassamAI-hy21-rasterizer-" + ("c" * 32))),
            (Join-Path $Profile `
              ("Documents\.MujassamAI-hy21-staging-" + ("d" * 32)))
          )) {
            if (Test-Path -LiteralPath $Removed) {
              throw "Expected removal target remains: $Removed"
            }
          }
          foreach ($Preserved in @(
            (Join-Path $Install "models\mini.keep"),
            (Join-Path $Install "app\vendor\mini.keep"),
            (Join-Path $Install "app\user.keep"),
            (Join-Path $Install "exports\model.glb"),
            (Join-Path $Local "MujassamAI\Engines\Hunyuan3D-2\models\mini.keep"),
            (Join-Path $Local "MujassamAI\UnrelatedCache\mini.keep"),
            (Join-Path $UnrelatedBackup "mini.keep"),
            (Join-Path $Profile "Downloads\keep.zip"),
            (Join-Path $Profile "Downloads\MujassamAI-Exports\model.glb"),
            (Join-Path $Profile "Documents\MujassamAI-Exports\model.glb"),
            (Join-Path $Profile "Downloads\MujassamAI-Build-UAE-test\repo.keep"),
            (Join-Path $PreviousSetup "keep"),
            (Join-Path $FailedSetup "keep"),
            (Join-Path $NestedExportSetup "nested\Exports\model.glb"),
            (Join-Path $SetupAncestor "ancestor.keep"),
            (Join-Path $SetupAncestor "other-install\keep"),
            (Join-Path $Temp "other-temp\keep"),
            (Join-Path $Profile "Documents\user-folder\keep")
          )) {
            if (-not (Test-Path -LiteralPath $Preserved -PathType Leaf)) {
              throw "Protected/unrelated file was removed: $Preserved"
            }
          }

          $CompletionMarker = Join-Path $Local `
            "MujassamAI\mini-only-restored-v1.json"
          if (-not (Test-Path -LiteralPath $CompletionMarker -PathType Leaf)) {
            throw "Mini completion marker is missing after DeepCleanup"
          }

          # Model a crash after one committed item was purged and journaled,
          # while a second item and transaction.json still remain.  The next
          # run must finish the item, persist its purged state, then delete the
          # journal last and remove the empty quarantine root.
          $DownloadsRoot = Join-Path $Profile "Downloads"
          $CommittedCrashId = "2" * 32
          $CommittedCrashQuarantine = Join-Path $DownloadsRoot `
            ".MujassamAI-hy21-quarantine-$CommittedCrashId"
          [IO.Directory]::CreateDirectory($CommittedCrashQuarantine) | Out-Null
          $AlreadyPurgedDownload = Join-Path $DownloadsRoot `
            "MujassamAI-Hunyuan21-PBR-Update-v1-20260827-120000.zip"
          $RemainingCommittedDownload = Join-Path $DownloadsRoot `
            "MujassamAI-Hunyuan21-PBR-Update-v1-20260827-120001.zip.sha256"
          $RemainingCommittedItem = Join-Path $CommittedCrashQuarantine `
            "item-000001"
          Write-TestText $RemainingCommittedItem "committed-item-to-purge"
          $CommittedCrashJournal = [ordered]@{
            schema_version = 2
            transaction_id = $CommittedCrashId
            purpose = "deep-cleanup"
            state = "committed"
            install_root = $Install
            entries = @(
              [ordered]@{
                item_name = "item-000000"
                quarantine_item = "item-000000"
                original_path = $AlreadyPurgedDownload
                containment_root = $DownloadsRoot
                kind = "file"
                original_sha256 = ("a" * 64)
                replacement_sha256 = $null
                state = "purged"
              },
              [ordered]@{
                item_name = "item-000001"
                quarantine_item = "item-000001"
                original_path = $RemainingCommittedDownload
                containment_root = $DownloadsRoot
                kind = "file"
                original_sha256 = (Get-TestSha256 $RemainingCommittedItem)
                replacement_sha256 = $null
                state = "moved"
              }
            )
          }
          $CommittedCrashMarker = Join-Path $CommittedCrashQuarantine `
            "transaction.json"
          Write-TestText $CommittedCrashMarker `
            ($CommittedCrashJournal | ConvertTo-Json -Depth 8)
          if (-not (Test-Path -LiteralPath $CommittedCrashMarker -PathType Leaf)) {
            throw "Committed partial-purge fixture lacks its durable journal"
          }

          # All H21 baselines are gone now, so the exact same command can
          # succeed only through the authenticated completion marker.
          & ./installer/remove-hunyuan21-local.ps1 @RemoveArguments
          if ($LASTEXITCODE -ne 0) { throw "Idempotent Mini-only removal failed" }
          if (-not (Test-Path -LiteralPath $CompletionMarker -PathType Leaf)) {
            throw "Mini completion marker is missing after backup-free rerun"
          }
          $RemainingH21Backups = @(
            Get-ChildItem -LiteralPath $BackupParent -Directory |
              Where-Object {
                $_.Name -cmatch `
                  '^hunyuan21(?:-rasterizer|-paint-8gb)?-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'
              }
          )
          if ($RemainingH21Backups.Count -ne 0) {
            throw "H21 backups reappeared after completion-marker rerun"
          }
          foreach ($PurgedTransactionPath in @(
            $CommittedCrashQuarantine,
            $AlreadyPurgedDownload,
            $RemainingCommittedDownload
          )) {
            if (Test-Path -LiteralPath $PurgedTransactionPath) {
              throw "Committed partial-purge recovery remains: $PurgedTransactionPath"
            }
          }
          if ((Get-TestSha256 $InstalledExe) -cne $OriginalExeHash -or
              (Get-TestSha256 $InstalledWorker) -cne $OriginalWorkerHash -or
              (Get-TestSha256 $Hunyuan2Worker) -cne $Hunyuan2WorkerHash -or
              (Get-TestSha256 $Hunyuan2Manifest) -cne $Hunyuan2ManifestHash) {
            throw "Backup-free rerun changed Mini or Hunyuan2"
          }
          foreach ($StillProtected in @(
            (Join-Path $Install "exports\model.glb"),
            (Join-Path $Profile "Downloads\MujassamAI-Exports\model.glb"),
            (Join-Path $Profile "Documents\MujassamAI-Exports\model.glb"),
            (Join-Path $Profile "Downloads\MujassamAI-Build-UAE-test\repo.keep")
          )) {
            if (-not (Test-Path -LiteralPath $StillProtected -PathType Leaf)) {
              throw "Backup-free rerun touched export/repository: $StillProtected"
            }
          }

          # Inject a post-restore GUI failure.  The transactional restore must
          # put both PBR shared files back byte-for-byte and must not begin
          # DeepCleanup of the H21 engine or its large local state.
          $RollbackRoot = Join-Path $env:RUNNER_TEMP (
            "mujassam-h21-rollback-" + [Guid]::NewGuid().ToString("N"))
          $RollbackInstall = Join-Path $RollbackRoot "install"
          $RollbackLocal = Join-Path $RollbackRoot "local"
          $RollbackProfile = Join-Path $RollbackRoot "profile"
          $RollbackTemp = Join-Path $RollbackRoot "temp"
          foreach ($Directory in @(
            $RollbackInstall, $RollbackLocal, $RollbackProfile, $RollbackTemp
          )) {
            [IO.Directory]::CreateDirectory($Directory) | Out-Null
          }

          $RollbackPython = Join-Path $RollbackInstall "rt\python.exe"
          [IO.Directory]::CreateDirectory(
            [IO.Path]::GetDirectoryName($RollbackPython)) | Out-Null
          [IO.File]::Copy($PortablePython, $RollbackPython, $false)
          $FailingGuiSource = Join-Path $RollbackRoot "failing-gui-stub.cs"
          $FailingMiniExe = Join-Path $RollbackRoot "failing-MujassamAI.exe"
          Write-TestText $FailingGuiSource @'
          internal static class Program
          {
              private static int Main(string[] args)
              {
                  return 23;
              }
          }
          '@
          & $Csc /nologo /target:winexe "/out:$FailingMiniExe" $FailingGuiSource
          if ($LASTEXITCODE -ne 0) {
            throw "Could not compile the injected failing GUI stub"
          }

          $RollbackInstalledExe = Join-Path $RollbackInstall "MujassamAI.exe"
          [IO.File]::WriteAllBytes($RollbackInstalledExe,
            [Text.Encoding]::ASCII.GetBytes("MZ-pbr-current-executable"))
          $RollbackInstalledWorker = Join-Path $RollbackInstall "app\worker.py"
          Write-TestText $RollbackInstalledWorker `
            'ENGINE = "hunyuan3d_2_1_pbr"'
          $RollbackH2Worker = Join-Path $RollbackInstall `
            "app\engines\hunyuan2\hunyuan2_worker.py"
          $RollbackH2Manifest = Join-Path $RollbackInstall `
            "app\engines\hunyuan2\ENGINE-MANIFEST.json"
          Write-TestText $RollbackH2Worker 'print("MJHUNYUANSELFTEST|OK|1")'
          Write-TestText $RollbackH2Manifest '{"engine":"mini"}'
          $RollbackH21Worker = Join-Path $RollbackInstall `
            "app\engines\hunyuan21\hunyuan21_worker.py"
          Write-TestText $RollbackH21Worker "pbr-engine-must-survive"
          $RollbackStateFile = Join-Path $RollbackLocal `
            "MujassamAI\Engines\Hunyuan3D-2.1\models\state.keep"
          Write-TestText $RollbackStateFile "pbr-state-must-survive"

          $PbrExeHashBefore = Get-TestSha256 $RollbackInstalledExe
          $PbrWorkerHashBefore = Get-TestSha256 $RollbackInstalledWorker
          $PbrEngineHashBefore = Get-TestSha256 $RollbackH21Worker
          $PbrStateHashBefore = Get-TestSha256 $RollbackStateFile
          $RollbackBackupParent = Join-Path $RollbackLocal `
            "MujassamAI\Backups"
          $RollbackBaseline = Join-Path $RollbackBackupParent `
            "hunyuan21-20010101T000000Z-abcdef12"
          [IO.Directory]::CreateDirectory($RollbackBaseline) | Out-Null
          [IO.File]::Copy($FailingMiniExe,
            (Join-Path $RollbackBaseline "MujassamAI.exe"), $false)
          $RollbackMiniWorkerBackup = Join-Path $RollbackBaseline `
            "app\worker.py"
          Write-TestText $RollbackMiniWorkerBackup `
            'print("MJSELFTEST|OK|3")'
          $RollbackExeBackup = Join-Path $RollbackBaseline "MujassamAI.exe"
          $RollbackReceipt = [ordered]@{
            schema_version = 1
            created_utc = "2001-01-01T00:00:00.0000000+00:00"
            install_root = $RollbackInstall
            update_zip = (Join-Path $RollbackProfile `
              "Downloads\MujassamAI-Hunyuan21-PBR-Update-v1.zip")
            update_zip_sha256 = ("1" * 64)
            overwritten_files = @(
              [ordered]@{
                path = "MujassamAI.exe"
                bytes = (Get-Item -LiteralPath $RollbackExeBackup).Length
                sha256 = (Get-TestSha256 $RollbackExeBackup)
                installed_sha256 = $PbrExeHashBefore
              },
              [ordered]@{
                path = "app/worker.py"
                bytes = (Get-Item -LiteralPath `
                  $RollbackMiniWorkerBackup).Length
                sha256 = (Get-TestSha256 $RollbackMiniWorkerBackup)
                installed_sha256 = $PbrWorkerHashBefore
              }
            )
            created_files = @(
              [ordered]@{
                path = "app/engines/hunyuan21/hunyuan21_worker.py"
                installed_sha256 = $PbrEngineHashBefore
              }
            )
          }
          Write-TestText (Join-Path $RollbackBaseline "install-receipt.json") `
            ($RollbackReceipt | ConvertTo-Json -Depth 8)

          $RollbackArguments = @{
            InstallRoot = $RollbackInstall
            LocalApplicationDataRoot = $RollbackLocal
            UserProfileRoot = $RollbackProfile
            TemporaryRoot = $RollbackTemp
            DeepCleanup = $true
            Confirm = $false
          }
          $InjectedFailureObserved = $false
          try {
            & ./installer/remove-hunyuan21-local.ps1 @RollbackArguments
          } catch {
            $InjectedFailureObserved = $true
            if ($_.Exception.Message -notmatch 'rollback') {
              throw "Failure fixture did not report transactional rollback: $_"
            }
            if ($_.Exception.Message -notmatch 'exit code:\s*23') {
              throw "Remover did not consume the waited GUI ExitCode: $_"
            }
            # Keep GitHub's pwsh epilogue independent of earlier native stubs.
            $global:LASTEXITCODE = 0
          }
          if (-not $InjectedFailureObserved) {
            throw "Injected post-restore GUI failure unexpectedly succeeded"
          }
          if ((Get-TestSha256 $RollbackInstalledExe) -cne $PbrExeHashBefore -or
              (Get-TestSha256 $RollbackInstalledWorker) -cne `
                $PbrWorkerHashBefore -or
              (Get-TestSha256 $RollbackH21Worker) -cne `
                $PbrEngineHashBefore -or
              (Get-TestSha256 $RollbackStateFile) -cne $PbrStateHashBefore) {
            throw "Transactional rollback did not restore the exact PBR state"
          }
          foreach ($RollbackPreserved in @(
            $RollbackH21Worker,
            $RollbackStateFile,
            (Join-Path $RollbackBaseline "install-receipt.json")
          )) {
            if (-not (Test-Path -LiteralPath $RollbackPreserved -PathType Leaf)) {
              throw "Rollback removed H21 engine/state/baseline: $RollbackPreserved"
            }
          }
          $UnexpectedRollbackMarker = Join-Path $RollbackLocal `
            "MujassamAI\mini-only-restored-v1.json"
          if (Test-Path -LiteralPath $UnexpectedRollbackMarker) {
            throw "Failed restore wrote a false Mini completion marker"
          }
          $RollbackQuarantines = @(
            Get-ChildItem -LiteralPath $RollbackRoot -Force -Recurse -Directory |
              Where-Object {
                $_.Name -cmatch `
                  '^\.MujassamAI-hy21-quarantine-[0-9a-f]{32}$'
              }
          )
          if ($RollbackQuarantines.Count -ne 0) {
            throw "Rollback left an active quarantine behind"
          }
          Write-Host "MJHUNYUAN21ACTIVERECOVERYSELFTEST|OK|1"
          Write-Host "MJHUNYUAN21COMMITTEDRECOVERYSELFTEST|OK|1"
          Write-Host "MJHUNYUAN21PBRBASEREJECTSELFTEST|OK|1"
          Write-Host "MJHUNYUAN21SETUPPROTECTSELFTEST|OK|1"
          Write-Host "MJHUNYUAN21ROLLBACKSELFTEST|OK|1"
          Write-Host "MJHUNYUAN21DEEPSELFTEST|OK|2"
          Write-Host "MJHUNYUAN21REMOVESELFTEST|OK|2"

      - name: Compile the repository-owned WinForms adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Work = Join-Path $env:RUNNER_TEMP "hunyuan21-adapter-csharp"
          New-Item -ItemType Directory -Path $Work | Out-Null
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsInstall = & $VsWhere -latest -products * -requires Microsoft.Component.MSBuild `
              -property installationPath | Select-Object -First 1
          if (-not $VsInstall) { throw "Visual Studio MSBuild was not found" }
          $Csc = Join-Path $VsInstall "MSBuild\Current\Bin\Roslyn\csc.exe"
          $Refs = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          $ReferenceNames = @(
            "System.dll", "System.Core.dll", "System.Drawing.dll",
            "System.Windows.Forms.dll", "System.Web.Extensions.dll"
          )
          $ReferenceArgs = @($ReferenceNames | ForEach-Object {
            $Path = Join-Path $Refs $_
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Missing .NET Framework reference: $Path"
            }
            "/reference:$Path"
          })
          $Executable = Join-Path $Work "MujassamAI-adapter-check.exe"
          & $Csc /nologo /noconfig /target:winexe /platform:x64 /optimize+ /debug- `
              /langversion:latest "/out:$Executable" @ReferenceArgs `
              app/Program.cs app/MainForm.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $Executable -PathType Leaf)) {
            throw "WinForms adapter compilation failed"
          }

  build-and-package:
    name: Territory-approved local full-build validation (no Actions distribution)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.full_build && inputs.license_accepted && inputs.territory_confirmed
    needs: adapter-static-validation
    runs-on: [self-hosted, Windows, X64, hy21-territory]
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      ARCHIVE_NAME: MujassamAI-Hunyuan21-PBR-Update-v1.zip
      RELEASE_TAG: hunyuan3d-2.1-pbr-v1
      RELEASE_MANIFEST: hunyuan21-update-release-manifest.json
      UPDATER_NAME: Hunyuan21UpdateSetup.exe
      PART_BYTES: "50331648"
      # Tencent source may not be published through a globally accessible
      # GitHub artifact/Release. It remains local to this approved runner.
      # Any source-materialized output from this non-publishing validation is
      # personal/local to its Territory-approved runner operator.
      MUJASSAM_HY21_LOCAL_PERSONAL_USE: "1"
      # Fail before source fetch or pip execution until every Windows runtime
      # dependency and transitive wheel has an approved SHA-256 lock entry.
      MUJASSAM_REQUIRE_HASHED_DEPENDENCIES: "1"
      MUJASSAM_HY21_LICENSE_ACCEPTED: ${{ inputs.license_accepted && '1' || '0' }}
      MUJASSAM_HY21_TERRITORY_CONFIRMED: ${{ inputs.territory_confirmed && '1' || '0' }}

    steps:
      - name: Checkout Mujassam AI source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select CPython 3.11.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Build and verify the Hunyuan3D 2.1 Windows update
        shell: pwsh
        run: ./build/build-hunyuan21-update.ps1

      - name: Create verified 48 MiB local test parts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Archive = Get-Item -LiteralPath $env:MUJASSAM_HUNYUAN21_ARCHIVE
          $StageManifest = Get-Content `
              (Join-Path $env:MUJASSAM_HUNYUAN21_STAGE "update-manifest.json") -Raw |
              ConvertFrom-Json
          if ($StageManifest.schema_version -ne 1 -or
              $StageManifest.archive -ne $env:ARCHIVE_NAME -or
              $StageManifest.source_commit -ne $env:GITHUB_SHA -or
              $StageManifest.usage_scope -ne "personal_local_only" -or
              $StageManifest.distribution_authorized -ne $false -or
              -not [string]::IsNullOrWhiteSpace(
                [string]$StageManifest.provider_legal_name) -or
              @($StageManifest.files).Count -eq 0) {
            throw "Built update manifest metadata is invalid"
          }

          $Output = Join-Path $env:RUNNER_TEMP "hunyuan21-release-output"
          New-Item -ItemType Directory -Path $Output | Out-Null
          $ArchiveHash = (Get-FileHash $Archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $Parts = [Collections.Generic.List[object]]::new()
          $Buffer = New-Object byte[] ([Int32]$env:PART_BYTES)
          $SplitBytes = [Int64]0
          $Input = [IO.File]::OpenRead($Archive.FullName)
          try {
            $Index = 1
            while (($Read = $Input.Read($Buffer, 0, $Buffer.Length)) -gt 0) {
              $Name = "$($env:ARCHIVE_NAME).part$($Index.ToString('D3'))"
              $Path = Join-Path $Output $Name
              $Part = [IO.File]::Open($Path, [IO.FileMode]::CreateNew,
                  [IO.FileAccess]::Write, [IO.FileShare]::None)
              try { $Part.Write($Buffer, 0, $Read); $Part.Flush($true) }
              finally { $Part.Dispose() }
              $Parts.Add([ordered]@{
                name = $Name
                bytes = [Int64]$Read
                sha256 = (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              })
              $SplitBytes += [Int64]$Read
              $Index++
            }
          }
          finally { $Input.Dispose() }
          if ($Parts.Count -lt 1 -or $SplitBytes -ne [Int64]$Archive.Length) {
            throw "ZIP splitting failed"
          }

          $ReleaseManifestObject = [ordered]@{
            schema_version = 1
            release_tag = $env:RELEASE_TAG
            source_run_id = [Int64]$env:GITHUB_RUN_ID
            source_commit = $env:GITHUB_SHA
            usage_scope = "personal_local_only"
            distribution_authorized = $false
            provider_legal_name = $null
            archive = [ordered]@{
              file_name = $env:ARCHIVE_NAME
              bytes = [Int64]$Archive.Length
              sha256 = $ArchiveHash
              parts = $Parts
            }
          }
          $ManifestPath = Join-Path $Output $env:RELEASE_MANIFEST
          $Json = $ReleaseManifestObject | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText(
              $ManifestPath, $Json, [Text.UTF8Encoding]::new($false))
          $ManifestHash = (Get-FileHash $ManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "HY21_OUTPUT=$Output" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HY21_MANIFEST_SHA256=$ManifestHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HY21_ARCHIVE_SHA256=$ArchiveHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HY21_PART_COUNT=$($Parts.Count)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile and self-test the resumable updater
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Work = Join-Path $env:RUNNER_TEMP "hunyuan21-updater-build"
          New-Item -ItemType Directory -Path $Work | Out-Null
          $Source = Get-Content installer/HunyuanUpdateSetup.cs -Raw
          if ($env:RELEASE_MANIFEST -notmatch '^[A-Za-z0-9_.-]+\.json$' -or
              $env:ARCHIVE_NAME -notmatch '^[A-Za-z0-9_.-]+\.zip$' -or
              $env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "Unsafe updater build metadata"
          }
          $ReleaseBase = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:RELEASE_TAG)"
          $Replacements = [ordered]@{
            "@@RELEASE_BASE_URL@@" = $ReleaseBase
            "@@GITHUB_REPOSITORY@@" = $env:GITHUB_REPOSITORY
            "@@RELEASE_TAG@@" = $env:RELEASE_TAG
            "@@MANIFEST_SHA256@@" = $env:HY21_MANIFEST_SHA256
          }
          foreach ($Pair in $Replacements.GetEnumerator()) {
            $Count = [regex]::Matches(
                $Source, [regex]::Escape([string]$Pair.Key)).Count
            if ($Count -ne 1) {
              throw "Expected one updater source marker $($Pair.Key), found $Count"
            }
            $Source = $Source.Replace($Pair.Key, $Pair.Value)
          }

          $OldManifestName = 'hunyuan-update-release-manifest.json'
          $ManifestNameCount = [regex]::Matches(
              $Source, [regex]::Escape($OldManifestName)).Count
          if ($ManifestNameCount -ne 1) {
            throw "Unexpected updater manifest-name contract: $ManifestNameCount"
          }
          $Source = $Source.Replace($OldManifestName, $env:RELEASE_MANIFEST)

          $OldRunContract = 'wire.source_run_id != 33030801098L'
          $RunContractCount = [regex]::Matches(
              $Source, [regex]::Escape($OldRunContract)).Count
          if ($RunContractCount -ne 1) {
            throw "Unexpected updater source-run contract: $RunContractCount"
          }
          $Source = $Source.Replace(
              $OldRunContract,
              "wire.source_run_id != $($env:GITHUB_RUN_ID)L")

          $OldRequiredPattern = (
            '"MujassamAI\.exe",\s*"app/worker\.py",\s*' +
            '"app/engines/hunyuan2/hunyuan2_worker\.py",\s*' +
            '"app/engines/hunyuan2/ENGINE-MANIFEST\.json"'
          )
          $RequiredCount = [regex]::Matches(
              $Source, $OldRequiredPattern,
              [Text.RegularExpressions.RegexOptions]::CultureInvariant).Count
          if ($RequiredCount -ne 1) {
            throw "Unexpected updater required-payload contract: $RequiredCount"
          }
          $NewRequired = @'
          "MujassamAI.exe", "NOTICE_THIRD_PARTY.md", "app/worker.py",
                              "app/engines/hunyuan21/hunyuan21_worker.py",
                              "app/engines/hunyuan21/ENGINE-MANIFEST.json",
                              "app/engines/hunyuan21/LICENSE-HUNYUAN3D-2.1.txt",
                              "app/engines/hunyuan21/NOTICE.txt"
          '@
          $Source = [regex]::Replace(
              $Source, $OldRequiredPattern, $NewRequired,
              [Text.RegularExpressions.RegexOptions]::CultureInvariant)

          # The generic Hunyuan2 updater accepts a very small base layout.
          # This generated H21 updater additionally requires the exact portable
          # ABI and assets that H21 reuses; the generic source remains unchanged.
          $OldBaseRequiredPattern = (
            '"MujassamAI\.exe",\s*Path\.Combine\("rt", "python\.exe"\),\s*' +
            'Path\.Combine\("app", "worker\.py"\)'
          )
          $BaseRequiredCount = [regex]::Matches(
              $Source, $OldBaseRequiredPattern,
              [Text.RegularExpressions.RegexOptions]::CultureInvariant).Count
          if ($BaseRequiredCount -ne 1) {
            throw "Unexpected updater base-layout contract: $BaseRequiredCount"
          }
          $NewBaseRequired = @'
          "MujassamAI.exe",
                          Path.Combine("rt", "python.exe"),
                          Path.Combine("app", "worker.py"),
                          "VERSION.txt",
                          "BUILD-MANIFEST.txt",
                          "MODEL-MANIFEST.json",
                          Path.Combine("app", "quality", "__init__.py"),
                          Path.Combine("app", "quality", "models.json"),
                          Path.Combine("app", "quality", "realesrgan_x2.py"),
                          Path.Combine("models", "realesrgan", "RealESRGAN_x2plus.pth"),
                          Path.Combine("models", "transparent-background", "ckpt_base.pth"),
                          Path.Combine("models", "spar3d", "config.yaml"),
                          Path.Combine("models", "spar3d", "model.safetensors"),
                          Path.Combine("app", "vendor", "stable-point-aware-3d", "spar3d", "system.py"),
                          Path.Combine("app", "vendor", "stable-point-aware-3d", "spar3d", "utils.py"),
                          Path.Combine("app", "vendor", "stable-point-aware-3d", "run.py")
          '@
          $Source = [regex]::Replace(
              $Source, $OldBaseRequiredPattern, $NewBaseRequired,
              [Text.RegularExpressions.RegexOptions]::CultureInvariant)

          $BaseLoopPattern = (
            'foreach \(string relative in required\)\s*\{\s*' +
            'string path = Path\.Combine\(root, relative\);\s*' +
            'if \(!File\.Exists\(path\) \|\| new FileInfo\(path\)\.Length <= 0\)\s*' +
            'throw new UpdateException\("التثبيت الأصلي ناقص: " \+ relative\);\s*\}'
          )
          $BaseLoopMatches = [regex]::Matches(
              $Source, $BaseLoopPattern,
              [Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if ($BaseLoopMatches.Count -ne 1) {
            throw "Unexpected updater base-validation loop: $($BaseLoopMatches.Count)"
          }
          $BasePreflight = @'
          string versionText = File.ReadAllText(Path.Combine(root, "VERSION.txt"), Encoding.UTF8);
                      string[] versionPins = new string[]
                      {
                          "Python: 3.11.9 application-local x64",
                          "PyTorch: 2.5.1+cu124",
                          "TorchVision: 0.20.1+cu124"
                      };
                      foreach (string pin in versionPins)
                          if (versionText.IndexOf(pin, StringComparison.Ordinal) < 0)
                              throw new UpdateException("إصدار MujassamAI-Portable الأساسي غير متوافق: " + pin);

                      string abiCode =
                          "import importlib.metadata as m,struct,sys,torch;" +
                          "tv=m.version('torchvision');" +
                          "ok=(sys.version_info[:3]==(3,11,9) and struct.calcsize('P')==8 and " +
                          "torch.__version__=='2.5.1+cu124' and tv=='0.20.1+cu124');" +
                          "print('MJABI|'+sys.version.split()[0]+'|'+torch.__version__+'|'+tv);" +
                          "sys.exit(0 if ok else 23)";
                      ProcessStartInfo abiInfo = new ProcessStartInfo
                      {
                          FileName = Path.Combine(root, "rt", "python.exe"),
                          Arguments = "-I -X utf8 -c \"" + abiCode + "\"",
                          WorkingDirectory = root,
                          UseShellExecute = false,
                          CreateNoWindow = true,
                          RedirectStandardOutput = true,
                          RedirectStandardError = true
                      };
                      using (Process abiProcess = new Process { StartInfo = abiInfo })
                      {
                          if (!abiProcess.Start())
                              throw new UpdateException("تعذر تشغيل فحص Python الأساسي.");
                          if (!abiProcess.WaitForExit(60000))
                          {
                              try { abiProcess.Kill(); } catch { }
                              throw new UpdateException("انتهت مهلة فحص Python الأساسي.");
                          }
                          string output = abiProcess.StandardOutput.ReadToEnd().Trim();
                          string error = abiProcess.StandardError.ReadToEnd().Trim();
                          string expected = "MJABI|3.11.9|2.5.1+cu124|0.20.1+cu124";
                          if (abiProcess.ExitCode != 0 || output.IndexOf(expected,
                              StringComparison.Ordinal) < 0)
                          {
                              string detail = (output + " " + error).Trim();
                              if (detail.Length > 500) detail = detail.Substring(0, 500);
                              throw new UpdateException("Python/PyTorch الأساسي غير متوافق: " + detail);
                          }
                      }
          '@
          $BaseLoop = $BaseLoopMatches[0]
          $BaseLoopReplacement = $BaseLoop.Value + [Environment]::NewLine + $BasePreflight
          $Source = $Source.Remove($BaseLoop.Index, $BaseLoop.Length).Insert(
              $BaseLoop.Index, $BaseLoopReplacement)

          $OldArchive = "MujassamAI-Hunyuan-Update-v1.zip"
          if ([regex]::Matches($Source, [regex]::Escape($OldArchive)).Count -ne 2) {
            throw "Unexpected updater archive-name contract"
          }
          $Source = $Source.Replace($OldArchive, $env:ARCHIVE_NAME)
          $OldTitle = "تحديث Hunyuan3D لجهاز 8GB VRAM"
          $TitleCount = [regex]::Matches(
              $Source, [regex]::Escape($OldTitle)).Count
          if ($TitleCount -ne 1) {
            throw "Unexpected updater title contract: $TitleCount"
          }
          $Source = $Source.Replace($OldTitle, "تحديث Hunyuan3D 2.1 بخامات PBR")
          $SelfTestMarker = '                report.AppendLine("ManifestSHA256=" + UpdaterConfiguration.GetManifestSha256());'
          $SelfTestMarkerCount = [regex]::Matches(
              $Source, [regex]::Escape($SelfTestMarker)).Count
          if ($SelfTestMarkerCount -ne 1) {
            throw "Unexpected updater self-test contract: $SelfTestMarkerCount"
          }
          $SelfTestLines = $SelfTestMarker + [Environment]::NewLine +
              '                report.AppendLine("ManifestAsset=" + UpdaterConfiguration.ManifestAssetName);' +
              [Environment]::NewLine +
              "                report.AppendLine(`"SourceRunId=$($env:GITHUB_RUN_ID)`");"
          $Source = $Source.Replace($SelfTestMarker, $SelfTestLines)
          foreach ($Forbidden in @(
              $OldManifestName, $OldRunContract,
              "app/engines/hunyuan2/hunyuan2_worker.py",
              "app/engines/hunyuan2/ENGINE-MANIFEST.json"
          )) {
            if ($Source.Contains($Forbidden)) {
              throw "Updater still contains obsolete contract: $Forbidden"
            }
          }
          $Unresolved = @(
            [regex]::Matches($Source, '@@[A-Z][A-Z0-9_]*@@') |
              ForEach-Object Value | Sort-Object -Unique
          )
          if ($Unresolved.Count -gt 0) {
            throw "Updater contains unresolved marker(s): $($Unresolved -join ', ')"
          }
          $Patched = Join-Path $Work "HunyuanUpdateSetup.cs"
          [IO.File]::WriteAllText($Patched, $Source, [Text.UTF8Encoding]::new($false))

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsInstall = & $VsWhere -latest -products * -requires Microsoft.Component.MSBuild `
              -property installationPath | Select-Object -First 1
          $Csc = Join-Path $VsInstall "MSBuild\Current\Bin\Roslyn\csc.exe"
          $Refs = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          $AppManifest = Join-Path $Work "updater.manifest"
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <assembly manifestVersion="1.0" xmlns="urn:schemas-microsoft-com:asm.v1">
            <assemblyIdentity version="1.0.0.0" name="MujassamAI.Hunyuan21Updater" />
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges>
              <requestedExecutionLevel level="asInvoker" uiAccess="false" />
            </requestedPrivileges></security></trustInfo>
            <application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings>
              <longPathAware xmlns="http://schemas.microsoft.com/SMI/2016/WindowsSettings">true</longPathAware>
            </windowsSettings></application>
          </assembly>
          '@ | Set-Content $AppManifest -Encoding utf8
          $ReferenceNames = @(
            "System.dll", "System.Core.dll", "System.Drawing.dll",
            "System.Windows.Forms.dll", "System.Web.Extensions.dll",
            "System.IO.Compression.dll", "System.IO.Compression.FileSystem.dll"
          )
          $ReferenceArgs = @($ReferenceNames | ForEach-Object {
            "/reference:$(Join-Path $Refs $_)"
          })
          $Updater = Join-Path $env:HY21_OUTPUT $env:UPDATER_NAME
          & $Csc /nologo /noconfig /target:winexe /platform:x64 /optimize+ /debug- `
              /langversion:latest "/win32manifest:$AppManifest" "/out:$Updater" `
              @ReferenceArgs $Patched
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $Updater -PathType Leaf)) {
            throw "Updater compilation failed"
          }
          $Report = Join-Path $Work "self-test.txt"
          $Process = Start-Process $Updater -ArgumentList @("--self-test", $Report) `
              -Wait -PassThru
          if ($Process.ExitCode -ne 0 -or -not (Test-Path $Report)) {
            throw "Updater self-test failed: $($Process.ExitCode)"
          }
          $Text = Get-Content $Report -Raw
          if (-not $Text.Contains("ReleaseBase=$ReleaseBase/") -or
              -not $Text.Contains("ReleaseTag=$($env:RELEASE_TAG)") -or
              -not $Text.Contains("ManifestSHA256=$($env:HY21_MANIFEST_SHA256)") -or
              -not $Text.Contains("ManifestAsset=$($env:RELEASE_MANIFEST)") -or
              -not $Text.Contains("SourceRunId=$($env:GITHUB_RUN_ID)")) {
            throw "Updater self-test reported incorrect pinned values"
          }
